# nginx — e.g. /etc/nginx/sites-available/comments.ryanfleck.ca
# (obtain the certificate with certbot --nginx -d comments.ryanfleck.ca)
server {
    listen 443 ssl http2;
    server_name comments.ryanfleck.ca;

    ssl_certificate     /etc/letsencrypt/live/comments.ryanfleck.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comments.ryanfleck.ca/privkey.pem;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name comments.ryanfleck.ca;
    return 301 https://$host$request_uri;
}
