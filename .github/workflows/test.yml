name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite and container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Runs the FiveAM suite inside the Dockerfile's `test` stage: the same
      # Debian SBCL and pinned Quicklisp dist as production. The build fails
      # if any test fails. Dependency layers are cached between runs.
      - name: Run test suite
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: rf-comments:ci
          cache-from: type=gha

      - name: Smoke test the container
        run: |
          set -euo pipefail
          mkdir -p data && sudo chown 10001:10001 data
          docker run -d --name rf-comments -p 127.0.0.1:8080:8080 \
            -v "$PWD/data:/data" \
            -e PUBLIC_URL=http://127.0.0.1:8080 -e ADMIN_PASSWORD=ci \
            rf-comments:ci

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          echo
          test "$(curl -fsS http://127.0.0.1:8080/healthz)" = ok
          curl -fsS http://127.0.0.1:8080/embed.js | grep -q 'rf-comments:height'
          curl -fsS http://127.0.0.1:8080/admin/login | grep -q 'Admin sign in'

          # The database must live on the host, outside the container.
          test -f data/comments.db

          # Docker's own HEALTHCHECK (runs `rf-comments healthcheck`).
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' rf-comments)
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "container health: $status"
          test "$status" = healthy

          # No live REPL unless explicitly enabled: nothing listens on 4005.
          # (`! cmd` would never fail the step under `set -e`, hence `if`.)
          if docker exec rf-comments grep -Eq ':0FA5 [0-9A-F]{8}:[0-9A-F]{4} 0A' /proc/net/tcp; then
            echo "REPL port is listening without SLYNK_PORT"; exit 1
          fi

          # Graceful shutdown on SIGTERM.
          docker stop -t 10 rf-comments

      - name: Smoke test the opt-in live REPL
        run: |
          set -euo pipefail
          secret=ci-secret-0123456789
          docker run -d --name rf-comments-repl -p 127.0.0.1:4005:4005 \
            -v "$PWD/data:/data" -e PUBLIC_URL=http://127.0.0.1:8080 \
            -e SLYNK_PORT=4005 -e SLYNK_INTERFACE=0.0.0.0 -e SLYNK_SECRET="$secret" \
            rf-comments:ci
          # Docker's port proxy accepts connections before Slynk is up, so wait
          # for the service to say it's listening.
          for i in $(seq 1 30); do
            docker logs rf-comments-repl 2>&1 | grep -q 'LIVE REPL listening' && break
            sleep 1
          done

          # Slynk packets: 6 hex digits of length, then the payload.
          rpc() {  # rpc SECRET -> whatever the server answers within 5s
            exec 3<>/dev/tcp/127.0.0.1/4005
            printf '%06x%s' "${#1}" "$1" >&3
            req='(:emacs-rex (slynk:connection-info) "COMMON-LISP-USER" t 1)'
            printf '%06x%s' "${#req}" "$req" >&3
            timeout 5 cat <&3 || true
            exec 3>&-
          }

          # A wrong secret is refused, and doesn't take the service down.
          if rpc wrong-secret-0000000 | grep -q '(:return (:ok'; then
            echo "REPL accepted a wrong secret"; exit 1
          fi
          test "$(docker inspect --format '{{.State.Running}}' rf-comments-repl)" = true

          # The right secret gets a working REPL.
          rpc "$secret" | grep -q '(:return (:ok'
          docker stop -t 10 rf-comments-repl

      - name: Container logs
        if: always()
        run: |
          docker logs rf-comments 2>&1 || true
          docker logs rf-comments-repl 2>&1 || true
